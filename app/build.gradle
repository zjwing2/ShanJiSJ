plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseSigningStoreFile = System.getenv("ANDROID_SIGNING_STORE_FILE")
def releaseSigningStorePassword = System.getenv("ANDROID_SIGNING_STORE_PASSWORD")
def releaseSigningKeyAlias = System.getenv("ANDROID_SIGNING_KEY_ALIAS")
def releaseSigningKeyPassword = System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
def hasReleaseSigning = [
    releaseSigningStoreFile,
    releaseSigningStorePassword,
    releaseSigningKeyAlias,
    releaseSigningKeyPassword
].every { it != null && !it.trim().isEmpty() }

android {
    compileSdk = 37
    // Provides llvm-strip for native libraries bundled by AndroidX.
    // 本地构建使用已安装的 NDK（本项目没有原生源码，NDK 只用于 strip 预编译 .so）。
    ndkVersion = System.getenv("MOEMEMOS_NDK_VERSION") ?: '27.0.12077973'

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    defaultConfig {
        applicationId = "me.mudkip.moememos"
        minSdk = 26
        targetSdk = 37
        // 版本号只在这一行维护。release-please 会依据约定式提交自动改写它
        // （识别靠行尾的 x-release-please-version 注解，配置见 release-please-config.json）。
        def sjVersionName = "2.1.0" // x-release-please-version
        versionName = sjVersionName
        // versionCode 由 versionName 推算，保证版本号一变就递增，不必手工同步：
        // major * 10000 + minor * 100 + patch，例如 2.1.0 -> 20100、3.0.0 -> 30000。
        // 预发布后缀（-beta.1 等）不参与计算，与对应正式版共用同一个 versionCode。
        def sjVersionParts = sjVersionName.tokenize('.-')
        versionCode = sjVersionParts[0].toInteger() * 10000 +
                sjVersionParts[1].toInteger() * 100 +
                sjVersionParts[2].toInteger()

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }

        ndk {
            // 端侧语音转写（sherpa-onnx）的原生库只带 arm64-v8a：完整 AAR 含四个
            // ABI，全带上会让 APK 多出 75MB，而 228MB 的 SenseVoice 模型在 32 位
            // 设备上本来也跑不动。显式声明，避免装到缺原生库的设备上再崩。
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigningStoreFile)
                storePassword releaseSigningStorePassword
                keyAlias releaseSigningKeyAlias
                keyPassword releaseSigningKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            crunchPngs = false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    namespace = 'me.mudkip.moememos'
}

dependencies {
    implementation "androidx.core:core-ktx:${rootProject.ext.core_ktx_version}"
    implementation "androidx.compose.ui:ui:${rootProject.ext.compose_version}"
    implementation "androidx.compose.foundation:foundation:${rootProject.ext.compose_version}"
    implementation "androidx.compose.material:material-icons-extended:${rootProject.ext.compose_material}"
    implementation "androidx.compose.material3:material3:${rootProject.ext.material3}"
    implementation "androidx.compose.material3.adaptive:adaptive:${rootProject.ext.material3_adaptive}"
    implementation "androidx.compose.material3.adaptive:adaptive-layout:${rootProject.ext.material3_adaptive}"
    implementation "androidx.compose.material3.adaptive:adaptive-navigation:${rootProject.ext.material3_adaptive}"
    implementation "androidx.compose.ui:ui-tooling-preview:${rootProject.ext.compose_version}"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:${rootProject.ext.lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${rootProject.ext.lifecycle_version}"
    implementation "androidx.lifecycle:lifecycle-process:${rootProject.ext.lifecycle_version}"
    implementation "androidx.activity:activity-compose:${rootProject.ext.activity_compose_version}"
    implementation "androidx.navigation:navigation-compose:${rootProject.ext.nav_version}"
    implementation "androidx.paging:paging-runtime-ktx:${rootProject.ext.paging_version}"
    implementation "androidx.paging:paging-compose:${rootProject.ext.paging_version}"
    implementation "androidx.room:room-runtime:${rootProject.ext.room_version}"
    implementation "androidx.room:room-ktx:${rootProject.ext.room_version}"
    ksp "androidx.room:room-compiler:${rootProject.ext.room_version}"
    implementation "com.squareup.retrofit2:retrofit:${rootProject.ext.retrofit_version}"
    implementation "com.squareup.retrofit2:converter-kotlinx-serialization:${rootProject.ext.retrofit_version}"
    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttp_version}"
    implementation "com.squareup.okhttp3:okhttp-urlconnection:${rootProject.ext.okhttp_version}"
    implementation "com.github.skydoves:sandwich:${rootProject.ext.sandwich}"
    implementation "com.github.skydoves:sandwich-retrofit:${rootProject.ext.sandwich}"
    implementation "com.github.skydoves:sandwich-retrofit-serialization:${rootProject.ext.sandwich}"
    implementation "io.coil-kt.coil3:coil-compose:${rootProject.ext.coil_version}"
    implementation "io.coil-kt.coil3:coil-network-okhttp:${rootProject.ext.coil_version}"
    implementation "org.jetbrains:markdown:${rootProject.ext.markdown_version}"
    implementation "com.mikepenz:multiplatform-markdown-renderer-m3:${rootProject.ext.markdown_renderer_version}"
    implementation "com.mikepenz:multiplatform-markdown-renderer-code:${rootProject.ext.markdown_renderer_version}"
    implementation "com.mikepenz:multiplatform-markdown-renderer-coil3:${rootProject.ext.markdown_renderer_version}"

    implementation "com.google.dagger:hilt-android:${rootProject.ext.hilt_version}"
    ksp "com.google.dagger:hilt-compiler:${rootProject.ext.hilt_version}"
    implementation "androidx.hilt:hilt-lifecycle-viewmodel-compose:${rootProject.ext.hilt_compose_version}"
    implementation "androidx.biometric:biometric:${rootProject.ext.biometric_version}"

    implementation "androidx.datastore:datastore:${rootProject.ext.datastore}"
    implementation "androidx.datastore:datastore-preferences:${rootProject.ext.datastore}"
    implementation "androidx.datastore:datastore-preferences-core:${rootProject.ext.datastore}"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "com.jakewharton.timber:timber:5.0.1"
    implementation "net.swiftzer.semver:semver:${rootProject.ext.semver_version}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:${rootProject.ext.compose_version}"
    debugImplementation "androidx.compose.ui:ui-tooling:${rootProject.ext.compose_version}"
    debugImplementation "androidx.compose.ui:ui-test-manifest:${rootProject.ext.compose_version}"
    
    // Glance for App Widget
    implementation "androidx.glance:glance:${rootProject.ext.glance_version}"
    implementation "androidx.glance:glance-appwidget:${rootProject.ext.glance_version}"
    implementation "androidx.glance:glance-material3:${rootProject.ext.glance_version}"
    implementation "androidx.work:work-runtime-ktx:${rootProject.ext.work_version}"

    // Markdown folder sync: SAF access to a user-chosen folder (e.g. a OneDrive sync folder).
    implementation "androidx.documentfile:documentfile:1.0.1"

    // 网页链接读取：OkHttp 抓页面 → jsoup 解析 DOM → Readability4J 抽正文 →
    // flexmark 转成 Markdown 追加进笔记。图片不下载，只保留远程链接。
    implementation "org.jsoup:jsoup:${rootProject.ext.jsoup_version}"
    implementation "net.dankito.readability4j:readability4j:${rootProject.ext.readability4j_version}"
    implementation "com.vladsch.flexmark:flexmark-html2md-converter:${rootProject.ext.flexmark_version}"
    // readability4j 只在 pom 里声明了 slf4j-api，Gradle 的 module 元数据没有带进来。
    // 不显式补上的话，第一次解析网页时会 NoClassDefFoundError（编译期看不出来）。
    implementation "org.slf4j:slf4j-api:${rootProject.ext.slf4j_version}"
    // 不接日志后端，免得启动时打印 "Failed to load class StaticLoggerBinder"
    runtimeOnly "org.slf4j:slf4j-nop:${rootProject.ext.slf4j_version}"

    // 端侧语音转写：sherpa-onnx 的 Kotlin API 与 JNI 绑定。
    // 原生库（libsherpa-onnx-jni.so / libonnxruntime.so 等，arm64-v8a，约 30MB）
    // 放在 src/main/jniLibs/arm64-v8a/，AGP 会自动打包，不需要 NDK 编译源码。
    // 模型文件（约 228MB）不进 APK，由 App 在用户同意后自行下载。
    implementation files('libs/sherpa-onnx.jar')
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}
