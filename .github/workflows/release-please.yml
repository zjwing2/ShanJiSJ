name: release-please

# 依据约定式提交（Conventional Commits）自动决定版本号：
#   feat:                      -> MINOR +1   （向下兼容的新功能）
#   fix:                       -> PATCH +1   （向下兼容的问题修复）
#   feat!: / BREAKING CHANGE:  -> MAJOR +1   （不兼容的破坏性改动）
#   chore: / docs: / ci: / test: -> 不发版
#
# 它不会直接发版，而是持续维护一个 Release PR（内含算好的版本号与 CHANGELOG）。
# 你在那个 PR 上点 Merge 之后，才真正打 tag、建 Release，随后本文件的下一个 job
# 自动构建 debug APK 并挂到该 Release 下。
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 为什么 APK 构建写在这里，而不是交给 build-apk.yml 的 tag 事件：
  # 用 GITHUB_TOKEN 打出的 tag 不会触发其他 workflow（GitHub 的防递归规则），
  # 只有放在同一个 workflow run 里才接得住。build-apk.yml 仍保留，用于手工
  # 推送 tag 的场景。
  build-apk:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # 本 fork 需要 NDK 给 AndroidX 的预编译 .so 做 strip（项目本身没有原生源码）
      MOEMEMOS_NDK_VERSION: '28.2.13676358'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # 原先用 android-actions/setup-android@v3，在新版 runner 上该 action 会失败；
      # 改为直接取官方 command-line tools，行为完全可控。
      - name: Set up Android command-line tools
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK root: $SDK"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/clt
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # compileSdk 37 的平台包在新版 SDK 里叫 platforms;android-37.0，
      # 且旧版 cmdline-tools 读不了 SDK XML v4，因此这里直接取官方 zip，最稳。
      - name: Install platform 37
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p "$SDK/platforms"
          curl -fsSL -o /tmp/platform37.zip https://dl.google.com/android/repository/platform-37.0_r02.zip
          unzip -q /tmp/platform37.zip -d /tmp/p37
          rm -rf "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
          mv /tmp/p37/android-37.0 "$SDK/platforms/android-37.0"
          cp -R "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"

      - name: Install build-tools 37
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p "$SDK/build-tools"
          curl -fsSL -o /tmp/bt37.zip https://dl.google.com/android/repository/build-tools_r37_linux.zip
          unzip -q /tmp/bt37.zip -d /tmp/bt37
          rm -rf "$SDK/build-tools/37.0.0"
          mv /tmp/bt37/android-37.0 "$SDK/build-tools/37.0.0"
          chmod +x "$SDK/build-tools/37.0.0"/* || true
          echo "sdk.dir=$SDK" > local.properties

      # NDK 只用于给 AndroidX 的预编译 .so 做 strip，项目本身没有原生源码。
      # 缺失时 AGP 只会告警并原样打包，不影响构建结果，所以这里允许失败，
      # 避免整个 CI 被 NDK 的下载/许可问题拖挂。
      - name: Install NDK (optional)
        continue-on-error: true
        run: |
          set -eux
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;${MOEMEMOS_NDK_VERSION}"

      # 单独一步先验证 wrapper 能否正常启动，便于在 CI 上快速定位故障环节
      - name: Gradle version check
        run: ./gradlew --version

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/ShanJiSJ-${{ needs.release-please.outputs.tag_name }}-debug.apk"

      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: out/*.apk
