name: Build MoeMemos (Markdown folder edition)

# 手动触发或推送 tag 时构建，产出可直接安装的 APK。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 本 fork 需要 NDK 给 AndroidX 的预编译 .so 做 strip（项目本身没有原生源码）
      MOEMEMOS_NDK_VERSION: '28.2.13676358'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools'

      # compileSdk 37 的平台包在新版 SDK 里叫 platforms;android-37.0，
      # 且旧版 cmdline-tools 读不了 SDK XML v4，因此这里直接取官方 zip，最稳。
      - name: Install platform 37 and build-tools 37
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          curl -fsSL -o /tmp/platform37.zip https://dl.google.com/android/repository/platform-37.0_r02.zip
          unzip -q /tmp/platform37.zip -d "$SDK/platforms"
          cp -R "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
          curl -fsSL -o /tmp/bt37.zip https://dl.google.com/android/repository/build-tools_r37_linux.zip
          unzip -q /tmp/bt37.zip -d /tmp/bt37
          mv /tmp/bt37/android-37.0 "$SDK/build-tools/37.0.0"
          chmod +x "$SDK/build-tools/37.0.0"/* || true
          sdkmanager "ndk;${MOEMEMOS_NDK_VERSION}" > /dev/null
          echo "sdk.dir=$SDK" > local.properties

      - name: Unit tests (codec round-trip)
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/MoeMemos-md-folder-${GITHUB_REF_NAME:-manual}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moememos-md-folder-debug-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
