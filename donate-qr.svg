  </g>
  <g fill="#2f6df0">
    <rect x="40" y="40" width="24" height="24" rx="3"/>
    <rect x="176" y="40" width="24" height="24" rx="3"/>
    <rect x="40" y="176" width="24" height="24" rx="3"/>
  </g>
  <text x="120" y="128" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1f2328">打赏二维码</text>
  <text x="120" y="152" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6b7280">请替换为你的微信 / 支付宝收款码</text>
