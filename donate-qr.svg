  <g fill="none" stroke="#2f6df0" stroke-width="3">
    <!-- 三个定位角，模拟二维码外观 -->
    <rect x="28" y="28" width="48" height="48" rx="6"/>
    <rect x="164" y="28" width="48" height="48" rx="6"/>
